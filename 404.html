<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5B4FE9">
    <meta name="robots" content="noindex, follow">
    <title>الصفحة غير موجودة | تعريبات ذا سويم</title>
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="image/thesoim.png">
    <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
    <link rel="shortcut icon" href="image/favicon-32.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <button id="themeToggle" class="theme-toggle theme-toggle-fixed" type="button" aria-label="تبديل الوضع الليلي والنهاري">
        <span class="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        <span class="icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
    </button>

    <nav class="navbar">
        <div class="nav-inner">
            <a class="nav-btn" href="index.html#home">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>
                <span class="nav-label">الرئيسية</span>
            </a>
            <a class="nav-btn" href="index.html#games">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="11.5" r="1"/><circle cx="18.5" cy="14" r="1"/></svg></span>
                <span class="nav-label">التعريبات</span>
            </a>
            <a class="nav-btn" href="index.html#official">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6l-9-4z"/><path d="m9 12 2 2 4-4"/></svg></span>
                <span class="nav-label">تعريبات رسمية</span>
            </a>
            <a class="nav-btn" href="index.html#accounts">
                <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6 15.4 6.4M8.6 13.4l6.8 4.2"/></svg></span>
                <span class="nav-label">حساباتي</span>
            </a>
        </div>
    </nav>

    <section class="container error-page">
        <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M9.5 9.5 8 8M14.5 9.5 16 8M8.5 15.5c1-1 2.2-1.5 3.5-1.5s2.5.5 3.5 1.5"/>
            </svg>
        </div>
        <p class="error-code">404</p>
        <h1 class="error-title">هذي الصفحة مو موجودة</h1>
        <p class="error-sub">يمكن الرابط قديم أو انكتب غلط، أو التعريب اللي تدور عليه انقل مكان ثاني.</p>

        <div class="error-actions">
            <a href="index.html" class="big-btn">الصفحة الرئيسية</a>
            <a href="index.html#games" class="big-btn big-btn-secondary">تصفح التعريبات</a>
        </div>
    </section>
</body>
</html>
